<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>สำหรับคนพิเศษ 💖</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(to right, #ffd1dc, #ffe4e1);
            font-family: 'Comic Sans MS', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        h1 {
            color: #d63384;
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .heart-button {
            background-color: #ff69b4;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .heart-button:hover {
            transform: scale(1.1);
        }
        
        #message {
            margin-top: 20px;
            font-size: 1.5em;
            color: #b3005f;
            display: none;
        }
        
        #gallery {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
        }
        
        #gallery img {
            width: 150px;
            height: 150px;
            border-radius: 15px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.3s, filter 0.3s;
            border: 5px solid #ff69b4;
            z-index: 1;
        }
        
        #gallery img:not(:hover) {
            filter: blur(3px) grayscale(80%);
            z-index: 0;
            opacity: 0.8;
        }
        
        #gallery img:hover {
            transform: scale(1.1) rotate(1deg);
            filter: none;
            z-index: 2;
        }
        
        #youtube-player {
            display: none;
        }
        
        .love-heart {
            position: absolute;
            font-size: 24px;
            animation: floatHeart 1s ease-out forwards;
            pointer-events: none;
            user-select: none;
        }
        
        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <h1>เค้ามีเรื่องอยากบอก...</h1>
    <button class="heart-button" onclick="showMessage(event)">กดใจดิ้ว้ะ</button>
    <div id="message"></div>

    <div id="gallery">
        <img src="c:/Users/USER/Pictures/IMG_0661.PNG" alt="moment 1" onclick="playMedia(event, 'xG2cluLNlno')">
        <img src="c:/Users/USER/Pictures/IMG_0664.PNG" alt="moment 2" onclick="playMedia(event, 'f8_7DYsDHtc')">
        <img src="c:/Users/USER/Pictures/IMG_0666.PNG" alt="moment 3" onclick="playMedia(event, 'tiktok1.mp3')">
        <img src="d:/asset unity/IMG_0665.PNG" alt="moment 4" onclick="playMedia(event, 'tiktok2.mp3')">
    </div>

    <div id="youtube-player">
        <iframe id="player" width="560" height="315" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <audio id="local-audio-player"></audio>

    <script>
        const colors = ['#ff69b4', '#ff4da6', '#ff85c1', '#ffb6c1', '#ff1493'];

        function showMessage(e) {
            const messageElement = document.getElementById('message');
            messageElement.style.display = 'block';
            messageElement.innerHTML = ""; // Clear any previous messages
            spawnHeart(e);

            const messageText = "คนๆนี้รักเธอมากกว่าผู้ใด";
            let i = 0;

            const interval = setInterval(() => {
                messageElement.innerHTML += messageText.charAt(i);
                i++;
                if (i === messageText.length) {
                    clearInterval(interval);
                }
            }, 100); // Adjust the speed of typing (100ms per character)
        }

        function playMedia(e, idOrFile) {
            spawnHeart(e);

            const isMp3 = idOrFile.endsWith('.mp3');
            const iframe = document.getElementById('player');
            const audio = document.getElementById('local-audio-player');

            if (isMp3) {
                iframe.src = "";
                iframe.style.display = 'none';

                audio.src = idOrFile;
                audio.play().then(() => {
                    console.log("🎵 Playing audio file:", idOrFile);
                }).catch(err => {
                    alert("ไม่สามารถเล่นเสียงได้: " + err.message);
                });

            } else {
                audio.pause();
                audio.currentTime = 0;

                iframe.src = "https://www.youtube.com/embed/" + idOrFile + "?autoplay=1";
                iframe.style.display = 'block';
                console.log("▶️ Playing YouTube video:", idOrFile);
            }

            // Show the message after playing media
            showMessage(e);
        }

        function spawnHeart(e) {
            const heart = document.createElement('span');
            heart.innerText = '💖';
            heart.className = 'love-heart';

            const x = e.clientX;
            const y = e.clientY;
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 1000);
        }
    </script>
</body>

</html>
